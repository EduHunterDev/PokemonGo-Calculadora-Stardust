name: Build Android Overlay APK
on:
  workflow_dispatch:
  push:
    branches: [android-overlay-v1]
    paths:
      - 'EduHunter-Stardust-Overlay-Repo-Package.zip'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: unzip -q EduHunter-Stardust-Overlay-Repo-Package.zip -d source
      - name: Build debug APK
        working-directory: source/EduHunterStardustOverlay_repo/android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EduHunter-Stardust-Overlay-APK
          path: source/EduHunterStardustOverlay_repo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
